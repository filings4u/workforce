<!doctype html><html lang="en" class="s4u-auth-pending"><head><link rel="icon" type="image/png" href="images/fav.png"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#24467f"><title>Manage Testing Program | screenings4u Compliance</title><link rel="stylesheet" href="assets/css/customer-compliance-v17.css"></head><body><div class="cc-app"><aside class="cc-side"><div class="cc-brand" data-compliance-logo></div><nav class="cc-nav" data-compliance-navigation data-active="programs"></nav></aside><main class="cc-main"><header class="cc-top"><strong id="companyName">screenings4u Compliance</strong><div class="cc-top-user"><div class="cc-user-copy"><span id="userEmail"></span><small id="userRole"></small></div><button class="cc-logout" onclick="CC.logout()">Sign Out</button></div></header><div class="cc-content"><div class="cc-heading"><a class="cc-back" href="programs.html">← Testing Programs</a><div class="cc-kicker">PROGRAM MANAGEMENT</div><h1 id="pageTitle">New Testing Program</h1><p>Configure DOT or non-DOT testing rules, random testing and selection frequency.</p></div><section class="cc-panel cc-management-form"><form id="form"><div class="cc-form-section"><div class="cc-form-grid"><div class="cc-field full"><label>Program Name</label><input name="name" required></div><div class="cc-field"><label>Program Type</label><select name="program_type"><option value="dot">DOT</option><option value="non_dot">Non-DOT</option><option value="company">Company</option></select></div><div class="cc-field"><label>DOT Agency</label><select name="dot_agency"><option value="">Not Applicable</option><option>FMCSA</option><option>FAA</option><option>FRA</option><option>FTA</option><option>PHMSA</option><option>USCG</option></select></div><div class="cc-field"><label>Status</label><select name="status"><option>active</option><option>inactive</option><option>archived</option></select></div><div class="cc-field"><labe
