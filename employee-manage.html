<!doctype html><html lang="en" class="s4u-auth-pending"><head><link rel="icon" type="image/png" href="images/fav.png"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#24467f"><title>Manage Employee | screenings4u Compliance</title><link rel="stylesheet" href="assets/css/customer-compliance.css?v=20260911-12"></head><body><div class="cc-app"><aside class="cc-side"><div class="cc-brand" data-compliance-logo></div><nav class="cc-nav" data-compliance-navigation data-active="employees"></nav></aside><main class="cc-main"><header class="cc-top"><strong id="companyName">screenings4u Compliance</strong><div class="cc-top-user"><div class="cc-user-copy"><span id="userEmail"></span><small id="userRole"></small></div><button class="cc-logout" onclick="CC.logout()">Sign Out</button></div></header><div class="cc-content"><div class="cc-heading cc-heading-actions"><div><a class="cc-back" href="employees.html">← Employees / Drivers</a><div class="cc-kicker">WORKFORCE MANAGEMENT</div><h1 id="pageTitle">Add Employee</h1><p>Manage the employee profile, employment record and DOT/CDL compliance information.</p></div></div><div class="cc-record-nav" id="recordNav" style="display:none"></div><section class="cc-panel cc-management-form"><form id="employeeForm"><div class="cc-form-section"><h2 class="cc-section-title">Profile</h2><div class="cc-form-grid"><div class="cc-field"><label>First Name</label><input name="first_name" required></div><div class="cc-field"><label>Last Name</label><input name="last_name" required></div><div class="cc-field"><label>Middle Name</label><input name="middle_name"></div><div class="cc-field"><label>Employee ID</label><input name="employee_number"></div><div class="cc-field"><label>Email</label><input name="email" type="email"></div><div class="cc-field"><label>Phone</label><input name="phone"></div><div class="cc-field"><label>Date of Birth</label><input name="date_of_birth" type="date"></div></div></div><div class="cc-form-section"><h2 class="cc-section-title">Employment</h2><div class="cc-form-grid"><div class="cc-field"><label>Hire Date</label><input name="hire_date" type="date"></div><div class="cc-field"><label>Job Title</label><input name="job_title"></div><div class="cc-field"><label>Department</label><input name="department"></div><div class="cc-field"><label>Work Location</label><input name="work_location"></div><div class="cc-field"><label>Job Classification</label><input name="job_classification"></div><div class="cc-field"><label>Employment Status</label><select name="employment_status"><option>active</option><option>inactive</option><option>terminated</option></select></div></div></div><div class="cc-form-section"><h2 class="cc-section-title">DOT / CDL</h2><div class="cc-form-grid"><div class="cc-field cc-check"><label><input name="is_dot_regulated" type="checkbox"> DOT Regulated</label><label><input name="safety_sensitive" type="checkbox"> Safety Sensitive</label><label><input name="clearinghouse_required" type="checkbox"> Clearinghouse Required</label></div><div class="cc-field"><label>CDL Number</label><input name="cdl_number"></div><div class="cc-field"><label>CDL State</label><input name="cdl_state"></div><div class="cc-field"><label>CDL Class</label><input name="cdl_class"></div><div class="cc-field"><label>CDL Expiration</label><input name="cdl_expiration_date" type="date"></div><div class="cc-field full"><label>Notes</label><textarea name="notes"></textarea></div></div></div><div class="cc-form-section cc-page-actions"><a class="cc-btn cc-btn-light" href="employees.html">Cancel</a><button class="cc-btn cc-btn-primary">Save Employee</button></div></form></section></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script src="assets/js/navigation.js?v=20260911-12"></script><script src="assets/js/customer-compliance-core.js?v=20260
