<!doctype html><html lang="en" class="s4u-auth-pending"><head><link rel="icon" href="images/fav.png"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#24467f"><title>Edit Employer Account | screenings4u Compliance</title><link rel="stylesheet" href="assets/css/customer-compliance-v17.css"></head><body><div class="cc-app"><aside class="cc-side"><div class="cc-brand" data-compliance-logo></div><nav class="cc-nav" data-compliance-navigation data-active="admin-employers"></nav></aside><main class="cc-main"><header class="cc-top"><strong id="companyName">screenings4u Compliance</strong><div class="cc-top-user"><div class="cc-user-copy"><span id="userEmail"></span><small id="userRole"></small></div><button class="cc-logout" onclick="CC.logout()">Sign Out</button></div></header><div class="cc-content"><div id="ccError" class="cc-error"></div><div class="cc-heading"><a class="cc-back" id="back" href="admin-employers.html">← Employer</a><div class="cc-kicker">ACCOUNT ADMINISTRATION</div><h1>Edit Employer Account</h1><p>Company profile, platform mode, portal access and subscription controls.</p></div><section class="cc-panel cc-management-form"><form id="form"><div class="cc-form-section"><h2>Company</h2><div class="cc-form-grid"><div class="cc-field"><label>Employer Name</label><input id="employerName" required></div><div class="cc-field"><label>Legal Name</label><input id="legalName"></div><div class="cc-field"><label>Email</label><input id="email" type="email"></div><div class="cc-field"><label>Phone</label><input id="phone"></div><div class="cc-field"><label>Billing Email</label><input id="billingEmail" type="email"></div><div class="cc-field"><label>Website</label><input id="website"></div><div class="cc-field full"><label>Address</label><input id="address1"></div><div class="cc-field full"><label>Address Line 2</label><input id="address2"></div><div class="cc-field"><label>City</label><input id="city"></div><div class="cc-field"><label>State</label><input id="state"></div><div class="cc-field"><label>Postal Code</label><input id="postal"></div><div class="cc-field"><label>Industry</label><input id="industry"></div><div class="cc-field"><label>DOT Number</label><input id="dotNumber"></div><div class="cc-field"><label>MC Number</label><input id="mcNumber"></div><div class="cc-field"><label>DOT Agency</label><select id="dotAgency"><option value="">None / Non-DOT</option><option>FMCSA</option><option>FAA</option><option>FRA</option><option>FTA</option><option>PHMSA</option><option>USCG</option></select></div></div></div><div class="cc-form-section"><h2>Platform & Subscription</h2><div class="cc-form-grid"><div class="cc-field"><label>Account Status</label><select id="accountStatus"><option>pending</option><option>active</option><option>suspended</option><option>cancelled</option><option>archived</option></select></div><div class="cc-field"><label>Operating Mode</label><select id="operatingMode"><option value="software_customer">Software Customer</option><option value="managed_client">Managed Client</option><option value="hybrid">Hybrid</option></select></div><div class="cc-field"><label>Plan</label><select id="plan"></select></div><div class="cc-field"><label>Subscription Status</label><select id="subscriptionStatus"><option>none</option><option>trialing</option><option>active</option><option>past_due</option><option>paused</option><option>cancelled</option><option>unpaid</option></select></div><div class="cc-field"><label>Current Period End</label><input id="periodEnd" type="datetime-local"></div><div class="cc-field cc-check-field"><label><input id="portalEnabled" type="checkbox"> Employer portal enabled</label></div></div></div><div class="cc-form-section cc-page-actions"><a id="cancel" class="cc-btn cc-btn-light" href="admin-employers.html">Cancel</a><button class="cc-btn cc-btn-primary">Save Employer Account</button></div></form></section></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script src="assets/js/navigation-v17.js"></script><script src="assets/js/customer-compliance-core.js?v=20260911-25"></script><script src="assets/js/admin-employer-edit.js?v=20260911-25"></script></body></html>
